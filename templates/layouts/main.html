<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .Title}}{{.Title}} — {{T .Lang "brand"}}{{else}}{{T .Lang "brand"}}{{end}}</title>
    <meta name="description" content="{{T .Lang "app.description"}}">
    <meta name="theme-color" content="#fcfefd" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1712" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <!-- The path the program is mounted on (empty when it has its own address); the scripts read it. -->
    <meta name="mail-base" content="{{$.Base}}">

    <!-- Favicons / app icons -->
    <link rel="icon" type="image/svg+xml" href="{{$.Base}}/assets/lilmail-favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="{{$.Base}}/assets/icon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="{{$.Base}}/assets/icon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="{{$.Base}}/assets/icon-180.png">
    <link rel="manifest" href="{{$.Base}}/assets/site.webmanifest">

    <link rel="stylesheet" href="{{$.Base}}/assets/css/mail.css">
    <!-- HTMX -->
    <script src="{{$.Base}}/assets/vendor/htmx.min.js"></script>
    <!-- Alpine.js -->
    <script defer src="{{$.Base}}/assets/vendor/alpine.min.js"></script>
</head>
<body>

<div id="htmx-loading-bar"></div>

{{if .Username}}
<!-- TOP BAR -->
<header class="topbar" x-data>
    <!-- Hamburger (mobile) -->
    <button class="topbar__hamburger"
            @click="$store.ui.sidebarOpen = !$store.ui.sidebarOpen"
            aria-label="{{T .Lang "sidebar.toggle"}}">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
    </button>

    <!-- Logo -->
    <a href="{{$.Base}}/inbox" class="topbar__logo" aria-label="{{T .Lang "nav.inbox.aria"}}">
        <img src="{{$.Base}}/assets/lilmail-favicon.svg" alt="" class="topbar__logo-img" aria-hidden="true">
        <span class="topbar__logo-word">{{T .Lang "brand"}}</span>
    </a>

    <!-- Search -->
    <div class="topbar__search">
        <svg class="topbar__search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0"/>
        </svg>
        <input type="search" placeholder="{{T .Lang "search.placeholder"}}"
               class="topbar__search-input"
               aria-label="{{T .Lang "search.aria"}}"
               name="q"
               hx-get="{{$.Base}}/api/search"
               hx-trigger="search, keyup changed delay:500ms"
               hx-target="#email-list-inner"
               hx-swap="innerHTML"
               hx-include="[name='q']">
    </div>

    <!-- Account -->
    <div class="topbar__account">
        <span class="topbar__username">{{.Username}}</span>
        <a href="{{$.Base}}/settings" class="topbar__settings" title="{{T .Lang "settings"}}">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
        </a>
        <button type="button" class="topbar__logout"
                hx-post="{{$.Base}}/logout"
                hx-swap="none"
                title="{{T .Lang "signout"}}">{{T .Lang "signout"}}</button>
    </div>
</header>
{{end}}

<!-- token carrier for JS fetch calls in compose / autocomplete -->
{{if .Token}}<span id="app-token" data-token="{{.Token}}" hidden></span>{{end}}

<!-- MAIN CONTENT -->
<div class="{{if .Username}}app-body{{end}}"
     x-data="{
         showEmailViewer: false,
         showComposeModal: false,
         toasts: [],
         addToast(toast) {
             const id = Date.now();
             this.toasts.push({ id, ...toast });
             setTimeout(() => this.removeToast(id), 5000);
         },
         removeToast(id) {
             this.toasts = this.toasts.filter(t => t.id !== id);
         }
     }"
     @show-toast.window="addToast($event.detail)"
>
    {{if .Error}}
    <div class="global-banner">
        <div class="alert alert--error">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            {{.Error}}
        </div>
    </div>
    {{end}}

    {{if .Success}}
    <div class="global-banner">
        <div class="alert alert--success">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
            {{.Success}}
        </div>
    </div>
    {{end}}

    {{embed}}
</div>

{{if notificationsEnabled}}
{{if .Username}}
<script src="{{$.Base}}/assets/js/notifications.js"></script>
{{end}}
{{end}}

{{if webPushEnabled}}
{{if .Username}}
<script src="{{$.Base}}/assets/js/push.js"></script>
{{end}}
{{end}}

<script src="{{$.Base}}/assets/js/app.js"></script>
</body>
</html>
